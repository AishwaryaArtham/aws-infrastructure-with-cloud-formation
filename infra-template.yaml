AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IaC Lab (v1) - Creates a VPC and an S3 bucket.

Resources:

  LabVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: iac-lab-vpc

  LabS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "iac-lab-bucket-${AWS::AccountId}-${AWS::Region}"
      Tags:
        - Key: Name
          Value: iac-lab-bucket

Outputs:

  VpcId:
    Description: ID of the created VPC
    Value: !Ref LabVPC

  VpcCidr:
    Description: CIDR range of the VPC
    Value: !GetAtt LabVPC.CidrBlock

  S3BucketName:
    Description: Name of the created S3 bucket
    Value: !Ref LabS3Bucket
